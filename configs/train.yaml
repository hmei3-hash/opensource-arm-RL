# ============================================================
# Training configuration for SO-ARM100 RL
# ============================================================

# --- Shared defaults ---
defaults:
  max_steps: 200
  render_mode: "direct"          # "human" for GUI, "direct" for headless
  randomize_target: false
  target_pos: [0.25, 0.0, 0.05]

# --- Phase 1: Reaching ---
phase1:
  total_timesteps: 300_000
  algorithm: PPO
  policy: MlpPolicy
  learning_rate: 3.0e-3
  n_steps: 2048
  batch_size: 64
  gamma: 0.99
  tensorboard_log: ./logs/phase1/

# --- Phase 2: Press-down (fine-tuning from Phase 1) ---
phase2:
  total_timesteps: 300_000
  algorithm: PPO
  pretrained_model: models/arm_phase1_model.zip
  reset_num_timesteps: false
  tensorboard_log: ./logs/phase2/
